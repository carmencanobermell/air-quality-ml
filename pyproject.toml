[project]
name = "airquality"
version = "0.1.0"
description = "Air quality analysis and 'high pollution' classification, with and without data leakage"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
